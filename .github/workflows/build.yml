name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build fonts-dejavu-core zip
          pip install pillow
      - name: Generate button art
        run: python3 tools/gen_assets.py
      - name: Build variants with NDK 30
        run: |
          NDK_ROOT=/usr/local/lib/android/sdk/ndk
          ls "$NDK_ROOT"
          NDK=$(ls -d "$NDK_ROOT"/30.* 2>/dev/null | sort -V | tail -1)
          test -n "$NDK"
          echo "Using NDK: $NDK"
          mkdir -p dist
          # name:stl:stage
          for spec in static_full:c++_static:9 static_s3:c++_static:3 shared_s3:c++_shared:3; do
            name=${spec%%:*}; rest=${spec#*:}; stl=${rest%%:*}; st=${rest##*:}
            echo "=== $name (stl=$stl stage=$st)"
            cmake -S . -B build_$name -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
              -DANDROID_STL=$stl -DCMAKE_CXX_FLAGS="-DFG_STAGE=$st"
            cmake --build build_$name --target flarial_gui -j
            d=dist/flarial_$name
            mkdir -p $d
            cp build_$name/libflarial_gui.so $d/
            sed -e "s/Flarial GUI/Flarial $name/" manifest.json > $d/manifest.json
            (cd $d && zip -r ../flarial_$name.levipack .)
          done
          ls dist
      - uses: actions/upload-artifact@v4
        with:
          name: flarial_gui
          path: dist
