name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build fonts-dejavu-core zip
          pip install pillow
      - name: Generate button art
        run: python3 tools/gen_assets.py
      - name: Build with several NDK versions
        run: |
          NDK_ROOT=/usr/local/lib/android/sdk/ndk
          ls "$NDK_ROOT"
          mkdir -p dist
          for v in 28 29 30; do
            NDK=$(ls -d "$NDK_ROOT"/$v.* 2>/dev/null | sort -V | tail -1)
            if [ -z "$NDK" ]; then echo "NDK $v not installed, skipping"; continue; fi
            echo "=== NDK $v: $NDK"
            cmake -S . -B build_$v -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
              -DANDROID_STL=c++_shared || continue
            cmake --build build_$v --target flarial_gui -j || continue
            d=dist/flarial_ndk$v
            mkdir -p $d
            cp build_$v/libflarial_gui.so $d/
            sed -e "s/Flarial GUI/Flarial NDK$v/" manifest.json > $d/manifest.json
            (cd $d && zip -r ../flarial_ndk$v.levipack .)
          done
          ls dist
          test -n "$(ls dist/*.levipack 2>/dev/null)"
      - uses: actions/upload-artifact@v4
        with:
          name: flarial_gui
          path: dist
